# /etc/nginx/sites-available/wayinn
server {
  server_name app.wayinn.in;            # change to your domain
  root /var/www/wayinn;                 # copy frontend/dist here
  index index.html;

  client_max_body_size 12m;   # guest ID photos / PDFs (the API accepts up to 10 MB)

  location /api/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location / { try_files $uri /index.html; }
}
